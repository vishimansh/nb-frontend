<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@800&amp;display=swap');
      .hindi-brand {
        font-family: 'Noto Sans Devanagari', sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: #2B2437;
      }
    </style>
  </defs>

  <!-- "नव" text -->
  <text x="10" y="48" class="hindi-brand">नव</text>

  <!-- Center Emblem -->
  <g transform="translate(68, 5) scale(0.65)">
    <!-- Waving Tricolor Flag -->
    <path d="M42 22 C 55 16, 68 28, 88 18 L 88 28 C 68 38, 55 26, 42 32 Z" fill="#FF9933" />
    <path d="M42 32 C 55 26, 68 38, 88 28 L 88 38 C 68 48, 55 36, 42 42 Z" fill="#FFFFFF" />
    <circle cx="65" cy="33" r="3.2" stroke="#000080" stroke-width="1" fill="none" />
    <path d="M42 42 C 55 36, 68 48, 88 38 L 88 48 C 68 58, 55 46, 42 52 Z" fill="#138808" />

    <!-- Flagpole -->
    <line x1="41" y1="14" x2="35" y2="78" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="41.5" cy="13.5" r="2" fill="#F5B55C" />

    <!-- Flag Bearer -->
    <path d="M38 34 C 39 31, 46 31, 48 35 L 37 36 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1" />
    <circle cx="43" cy="38" r="4.5" fill="#FCD34D" />
    <path d="M36 43 C 38 41, 47 41, 50 44 L 52 64 L 34 64 Z" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" />
    <path d="M45 44 L 40 30" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- "भारत" text -->
  <text x="140" y="48" class="hindi-brand">भारत</text>
</svg>
